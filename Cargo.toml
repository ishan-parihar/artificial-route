[workspace]
members = ["crates/*"]
resolver = "3"

# Inherited by every crate; see docs/03-crates-and-deps.md.
[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

# Versions from docs/03-crates-and-deps.md. P0 pulls only the subset the
# lean-routing spine needs; the rest arrive with their phase.
[workspace.dependencies]
ar-core = { path = "crates/ar-core" }
ar-config = { path = "crates/ar-config" }
ar-registry = { path = "crates/ar-registry" }
ar-route = { path = "crates/ar-route" }

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout"] }
http-body-util = "0.1"
hyper = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
arc-swap = "1.7"
notify-debouncer-full = "0.3"
shellexpand = "3.1"

futures = "0.3"
async-stream = "0.3"
bytes = "1.10"
uuid = { version = "1.18", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
insta = "1.43"

# `ar` binary only: a global allocator cannot live in a library, and the
# 00-overview RAM budget (<35MB idle) assumes jemalloc over glibc malloc.
jemallocator = "0.5"

# ch.2/ch.3: the gate is `-D warnings`, and these are the lints the AGENTS.md
# discipline names explicitly, denied crate-wide so a regression fails the
# build rather than waiting for review.
#
# `clippy::todo` is deliberately absent: the P0 cross-crate seams
# (`ArTranslate` / `ArExec`) are `todo!()` until their crates land. Express
# "not implemented" as `Strategy::Deferred` (docs/02) rather than a panic on a
# live request. `missing_docs` is a crate attribute (`#![deny(missing_docs)]`),
# not a workspace lint, so an undocumented sibling does not break this gate.
[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"

[profile.release]
lto = true
codegen-units = 1
