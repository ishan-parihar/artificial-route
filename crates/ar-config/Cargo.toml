[package]
name = "ar-config"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "File-mode configuration: YAML + $VAR injection, hot reload, live ArcSwap snapshot"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
ar-compress = { path = "../ar-compress" }
ar-core = { workspace = true }
# `Config::custom_providers` *is* `ar_registry::CustomProvider`, so the two shapes
# cannot drift; the alternative is a second struct plus a mapping function in
# every consumer.
ar-registry = { workspace = true }
arc-swap = { workspace = true }
notify-debouncer-full = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
