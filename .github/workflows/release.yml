# Publishes a GitHub release when a `v*` tag is pushed.
#
# Exists because the releases were being uploaded by hand: v0.1.1 sat four days
# behind `main` with no workflow to notice. A hand-uploaded asset also drifts
# from the source it claims to be, which is the one thing a checksum cannot
# catch. Everything below is built from the tag's own commit, so the asset and
# the tag name the same tree.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The toolchain file is pinned, so CI builds with the same rustc the
      # release candidate was tested against rather than whatever is newest.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test the tagged commit
        # The release job is the only thing standing between a tag and every
        # machine that runs `install.sh`, so a tag that does not pass the suite
        # must not produce an asset. Costs one step; buys not shipping a
        # regression to people who never run this repository's CI.
        run: cargo test --workspace --release --locked

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      # `rustup target add` supplies musl's Rust std only. A dependency with C
      # sources still shells out to a musl-targeting C compiler, which the
      # runner does not have — the first attempt at this workflow failed on
      # `x86_64-linux-musl-gcc` rather than on anything about the code.
      - name: Install musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          x86_64-linux-musl-gcc --version

      # Same flags the local release build used. `--locked` matters most: without
      # it CI silently resolves fresh dependency versions and ships a binary
      # nobody has run the test suite against.
      # install.sh is the single entry point every user reaches via `curl | sh`,
      # and it has no Rust test to run. It shipped four real defects that only
      # manual runs caught — a dollar-sign in a generated comment, a variable
      # read before assignment (three times), and a relative $0 that stopped
      # existing after the script cd'd to its temp dir. Each aborted or
      # silently disabled the installer, and none would have failed a build.
      - name: Lint the installer
        run: |
          sh -n install.sh
          # shellcheck's own binary, not a package manager: the runner is
          # ephemeral and this is the only step that needs it.
          curl -fsSL -o /tmp/sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          /tmp/shellcheck-stable/shellcheck -s sh install.sh

      - name: Smoke the installer
        run: |
          SCRATCH="$(mktemp -d)"
          # Every branch the summary prints, each in a scratch HOME so a real
          # config is never touched. The point is the paths that abort under
          # `set -u` when a variable is read before it is assigned: those exit
          # non-zero and must fail here rather than on a user's machine.
          sh install.sh --help >/dev/null
          sh install.sh --check --dir "$SCRATCH/bin" | grep -q 'not installed'
          sh install.sh --version v0.0.0-nonexistent --dir "$SCRATCH/bin" \
            && { echo "::error::a bogus tag should not install"; exit 1; }
          # --service none must reach the summary, which prints state variables
          # only the service branch assigns.
          sh install.sh --service none --dir "$SCRATCH/bin" >/dev/null
          sh install.sh --uninstall --service none --dir "$SCRATCH/bin" >/dev/null
          rm -rf "$SCRATCH"

      - name: Build static binary
        run: |
          cargo build \
            --release \
            --locked \
            --target x86_64-unknown-linux-musl \
            --bin ar
          strip target/x86_64-unknown-linux-musl/release/ar || true

      - name: Smoke the artifact
        # A release that cannot print its own version is not worth uploading.
        # `--version` is the one invocation with no config or network needs, so
        # it is the only honest gate available before publishing.
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/ar
          chmod +x "$BIN"
          "$BIN" --version
          # Match `static` rather than `statically linked`: a PIE binary reports
          # as "static-pie linked", and the first version of this check demanded
          # the non-PIE wording and rejected a perfectly good artifact.
          INFO="$(file -b "$BIN")"
          echo "$INFO"
          case "$INFO" in
            *ELF*static*) ;;
            *) echo "::error::not a static ELF; install.sh promises no runtime deps"; exit 1 ;;
          esac
          # The artifact must agree with the tag it is published under. Without
          # this, a release can ship a binary whose own `--version` reports a
          # different number than its download URL — the failure is invisible
          # until a user sees `ar 0.1.2` installed from a v0.1.3 release.
          GOT="$("$BIN" --version | sed -n 's/^ar //p')"
          # `inputs.tag` wins over the ref for the same reason it does below:
          # a dispatch arrives with GITHUB_REF_NAME=main, so reading the ref
          # compares the binary against a branch name.
          WANT="${{ inputs.tag || github.ref_name }}"
          WANT="${WANT#v}"
          echo "version:  built $GOT, tag wants $WANT"
          [ -n "$WANT" ] || { echo "::error::could not derive a version from the ref"; exit 1; }
          [ "$GOT" = "$WANT" ] || { echo "::error::binary reports $GOT but the release tag is $WANT"; exit 1; }

      - name: Package
        id: pkg
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ar dist/ar-x86_64-unknown-linux-musl
          cd dist
          sha256sum ar-x86_64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
          # The dispatch path arrives with GITHUB_REF_NAME=main, so reading the
          # ref here published a release literally tagged "main" — which the
          # releases API then reports as the latest, and install.sh would then
          # try to download from a tag that does not exist. The input wins.
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Guards the bug two runs ago: a mis-dispatched run used to publish a
      # release literally tagged `main`, which /releases/latest then reported to
      # every installer. Failing here says why; a generic API error would not.
      - name: Guard the tag
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to publish a release tagged '$TAG' — expected a v* version tag"; exit 1 ;;
          esac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ar ${{ steps.pkg.outputs.tag }}
          # Replace rather than fail when the tag is re-pushed: a re-run after a
          # transient build failure should repair the release, not require a
          # version bump.
          fail_on_unmatched_files: false
          files: |
            dist/ar-x86_64-unknown-linux-musl
            dist/SHA256SUMS
          body: |
            Static musl binary, no runtime dependencies.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Verify with `sha256sum -c SHA256SUMS`.
