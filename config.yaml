# Artificial Route — sample configuration (File mode)
#
# Environment references below are expanded from the environment BEFORE the YAML
# is parsed, so no secret ever lives in this file. `ar` fails loudly if one is
# unset rather than sending an unauthenticated request upstream.
#
# NOTE: expansion covers the whole file, comments included, so a literal
# dollar-sign followed by a name anywhere — including in a comment — is treated
# as an environment reference. Spell it out in prose instead.
#
#   export OPENAI_API_KEY=sk-...
#   export ANTHROPIC_API_KEY=sk-ant-...
#   ar doctor

server:
  host: 127.0.0.1
  port: 20128

# Declared credentials, keyed by name. A provider references these by name so
# several providers can share one secret and the secret stays in the environment.
keys:
  openai: $OPENAI_API_KEY
  anthropic: $ANTHROPIC_API_KEY

# Configured provider instances. `id` must exist in the compiled-in registry
# (crates/ar-registry/src/registry.json, generated by `ar import`); the `key`
# name must exist under `keys`.
providers:
  - id: openai
    key: openai
  - id: anthropic
    key: anthropic

# Providers the compiled-in registry does not carry: a self-hosted gateway, a
# vendor compat shim, a local model server. Declaring one here makes it routable
# with no rebuild — the id resolves exactly like a catalog provider's.
#
#   protocol:   openai-compatible | anthropic-compatible. Only the OpenAI wire
#               is dispatched in this build; an anthropic-compatible node is
#               accepted and named by `ar doctor`, but refused at dispatch.
#   base_url:   the endpoint root, without a trailing slash.
#   key_ref:    a name under `keys:` above, never a value.
#   headers:    optional extra outbound headers, for a gateway that wants
#               something other than a bearer token. `ar doctor` checks the shape.
#
# An `id` that already exists in the compiled-in catalog is refused, loudly,
# rather than shadowing it.
#
# custom_providers:
#   - id: my-gateway
#     protocol: openai-compatible
#     base_url: https://gateway.internal.example/v1
#     key_ref: my_gateway
#     headers:
#       x-api-key: placeholder

# OAuth sessions, one per provider id. The block carries placement only — no
# token, no secret — so a committed config.yaml cannot leak one through it.
#
#   provider:           registry id; one session per id.
#   refresh_key:        a second row under `keys:` holding the refresh token.
#                       Without it the session works but cannot renew, so its
#                       first upstream 401 is terminal.
#   token_url:          refresh endpoint. Required to renew; never guessed from
#                       the provider id, because a guessed auth endpoint would
#                       be an invented wire format.
#   client_id:          public OAuth client id, when the endpoint wants one.
#   authorization_url:  authorize endpoint a browser login opens. Without it
#                       `ar` login cannot start and says so. Never guessed.
#   redirect_uri:       optional override for the callback. Omit it and the
#                       login flow's own loopback listener is used; set it and
#                       it must be https or a loopback http address, so an
#                       authorization code is never posted in cleartext.
#   client_secret_key:  a third row under `keys:` holding a static client secret,
#                       for providers that are confidential clients. Omit it and
#                       the session is PKCE-only.
#
# oauth:
#   - provider: codex
#     refresh_key: codex_refresh
#     token_url: https://auth.example.invalid/token
#     client_id: your-public-client-id
#     authorization_url: https://auth.example.invalid/authorize
#     redirect_uri: http://127.0.0.1:1455/callback
#     client_secret_key: codex_client_secret

# Routing combos. A client asking for the model `default` gets this chain.
#
# Strategies: any of the nineteen ar-route names (priority, round-robin,
# cost-optimized, lkgp, weighted, fill-first, p2c, least-used, random,
# strict-random, headroom, reset-window, reset-aware, quota-share-fair,
# context-relay, context-optimized, cache-optimized, fusion, pipeline), plus
# `auto/*` for the virtual factory. A name this build does not know parses as
# deferred and gets a 501 naming it, rather than failing to load the file.
combos:
  - id: default
    strategy: lkgp
    targets:
      - openai/gpt-5.4
      - anthropic/claude-sonnet-5

  # Two priced targets, so `cost-optimized` has something to compare: the nano
  # tier costs a fraction of the flagship, and an unpriced target sorts last
  # rather than winning by being first in the file.
  - id: cheap
    strategy: cost-optimized
    targets:
      - openai/gpt-5.4
      - openai/gpt-5.4-nano